name: SafEye CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings as non-blocking (exit-zero)
          flake8 backend/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run tests with coverage
        run: |
          pytest tests/ -m "not slow" -v --tb=short --co -q 2>/dev/null | head -5
          pytest tests/ -m "not slow" -v --tb=short
        env:
          FLASK_ENV: testing
          PYTHONDONTWRITEBYTECODE: 1

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check dependencies for known vulnerabilities
        run: safety check -r requirements.txt --output text || true
        continue-on-error: true

      - name: Run bandit security linter
        run: bandit -r backend/ -ll -ii --skip B101 -f txt || true
        continue-on-error: true

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: safeye:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=min
          load: true

      - name: Verify container starts
        run: |
          docker run -d --name safeye-test -p 7860:7860 safeye:ci-test
          sleep 5
          curl -f http://localhost:7860/api/health || exit 1
          docker stop safeye-test
